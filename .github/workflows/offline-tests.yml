name: Offline contracts and MCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      matrix:
        python: ['3.10', '3.12']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          AUTO_CATIA_TEST_NO_LIVE: '1'
