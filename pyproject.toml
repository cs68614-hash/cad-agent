[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-catia-mcp"
version = "0.1.0"
description = "Unified automotive-oriented CATIA V5 MCP bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.27,<2",
  "jsonschema>=4.20,<5",
  "uvicorn>=0.30,<1",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
automotive-catia-mcp = "automotive_catia.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
automotive_catia = ["*.json"]
